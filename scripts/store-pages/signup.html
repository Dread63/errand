<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>Fieldnote — Start your trial</title><link rel="stylesheet" href="style.css" /></head>
  <body>
    <header><span class="dot"></span>Fieldnote<nav><span>Product</span><span>Pricing</span><span>Docs</span><span>Sign in</span></nav></header>
    <main>
      <h1>Start your free trial</h1>
      <p class="sub">14 days free. No credit card required.</p>
      <form onsubmit="event.preventDefault()">
        <label>Full name <input name="name" autocomplete="off" /></label>
        <label>Work email <input name="email" type="email" autocomplete="off" /></label>
        <label>Company <input name="company" autocomplete="off" /></label>
        <label>Plan
          <select name="plan"><option>Starter</option><option>Team</option><option>Business</option></select>
        </label>
        <label class="row"><input type="checkbox" /> Send me product updates</label>
        <button type="submit">Start trial</button>
      </form>
    </main>
  </body>
</html>
