<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>Sign up</title></head>
  <body>
    <h1>Create your account</h1>
    <form id="f">
      <p><label>Full name <input name="name" required /></label></p>
      <p><label>Email <input name="email" type="email" required /></label></p>
      <p>
        <label>Country
          <select name="country">
            <option value="">Choose…</option>
            <option value="us">United States</option>
            <option value="uk">United Kingdom</option>
            <option value="ca">Canada</option>
          </select>
        </label>
      </p>
      <fieldset>
        <legend>Preferred contact</legend>
        <label><input type="radio" name="contact" value="email" /> Email</label>
        <label><input type="radio" name="contact" value="phone" /> Phone</label>
      </fieldset>
      <p><label><input type="checkbox" name="newsletter" /> Send me the newsletter</label></p>
      <p><label>Message <textarea name="message" rows="3"></textarea></label></p>
      <button type="submit">Create account</button>
    </form>
    <pre id="out"></pre>
    <script>
      document.getElementById('f').addEventListener('submit', (e) => {
        e.preventDefault();
        const d = Object.fromEntries(new FormData(e.target));
        d.newsletter = d.newsletter === 'on';
        document.getElementById('out').textContent = JSON.stringify(d);
      });
    </script>
  </body>
</html>
